# TEMPLATE — NOT applied by ArgoCD (excluded in the Application's directory.exclude).
# Create the real Secret imperatively so values never enter git:
#
#   export KUBECONFIG=/mnt/c/Users/chris/.kube/static/idl-xnl-jhb1-01.yaml
#   kubectl create namespace mcp --dry-run=client -o yaml | kubectl apply -f -
#   kubectl -n mcp create secret generic intervals-mcp-secrets \
#     --from-literal=INTERVALS_API_KEY=...                       \
#     --from-literal=INTERVALS_ATHLETE_ID=i579914                \
#     --from-literal=OAUTH_CLIENT_ID=intervals-mcp-$(openssl rand -hex 8) \
#     --from-literal=OAUTH_CLIENT_SECRET=$(openssl rand -hex 32)  \
#     --from-literal=REDIS_URL="redis://:$REDIS_PW@idealogic-prod-redis-master.redis.svc.cluster.local:6379/3"
#
# REDIS_URL is OPTIONAL. When present, OAuth tokens persist across pod rollouts
# (no forced re-auth after a deploy); when absent the server uses in-memory state.
# The deployment injects all of these via `envFrom: secretRef` — adding REDIS_URL
# to this secret is all that is needed to switch on persistence. Source the Redis
# password (do not hard-code):
#   REDIS_PW=$(kubectl -n redis get secret redis-credentials -o jsonpath='{.data.redis-password}' | base64 -d)
# Use a distinct Redis DB number (or key prefix) per MCP server to avoid collisions.
#
# NOTE: kubectl apply 3-way-merges Secrets (adds keys, never removes). To change
# the key schema, use kubectl delete + create instead of apply.
apiVersion: v1
kind: Secret
metadata:
  name: intervals-mcp-secrets
  namespace: mcp
type: Opaque
